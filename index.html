<!doctype html>
<html lang="es" class="h-full bg-[#EFEFEF]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayaLibre — Mapea accesos y libera playas públicas</title>
    <meta name="description" content="PlayaLibre es una plataforma colectiva para reportar cobros ilegales, dibujar accesos bloqueados y defender el libre tránsito en las costas de México." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://playalibre.org/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://playalibre.org/" />
    <meta property="og:title" content="PlayaLibre — Mapea accesos y libera playas públicas" />
    <meta property="og:description" content="PlayaLibre es una plataforma colectiva para reportar cobros ilegales, dibujar accesos bloqueados y defender el libre tránsito en las costas de México." />
    <meta property="og:image" content="/playalibre_logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://playalibre.org/" />
    <meta property="twitter:title" content="PlayaLibre — Mapea accesos y libera playas públicas" />
    <meta property="twitter:description" content="PlayaLibre es una plataforma colectiva para reportar cobros ilegales, dibujar accesos bloqueados y defender el libre tránsito en las costas de México." />
    <meta property="twitter:image" content="/playalibre_logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fustat:wght@700;800&family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
      window.addEventListener('error', function(e) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.backgroundColor = '#fee2e2';
        div.style.color = '#991b1b';
        div.style.padding = '20px';
        div.style.zIndex = '999999';
        div.style.borderBottom = '4px solid #f87171';
        div.style.fontFamily = 'monospace';
        div.style.whiteSpace = 'pre-wrap';
        div.innerHTML = '<strong>Unhandled Error:</strong> ' + e.message + ' at ' + e.filename + ':' + e.lineno;
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.backgroundColor = '#fee2e2';
        div.style.color = '#991b1b';
        div.style.padding = '20px';
        div.style.zIndex = '999999';
        div.style.borderBottom = '4px solid #f87171';
        div.style.fontFamily = 'monospace';
        div.style.whiteSpace = 'pre-wrap';
        var msg = e.reason && (e.reason.stack || e.reason.message || e.reason);
        div.innerHTML = '<strong>Unhandled Promise Rejection:</strong> ' + msg;
        document.body.appendChild(div);
      });
    </script>
  </head>
  <body class="min-h-full text-gray-900 antialiased font-sans bg-[#EFEFEF] overflow-x-hidden">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
